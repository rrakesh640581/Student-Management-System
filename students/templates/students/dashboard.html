
<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #222;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .card h2 {
            color: #555;
        }

        .card p {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        a {
            display: block;
            text-align: center;
            color: #2563eb;
        }
        /* Responsive Dashboard */

.container {
    grid-template-columns: repeat(2, 1fr);
    width: 100%;
    max-width: 800px;
}

.card {
    box-sizing: border-box;
}

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 24px;
    }

    .container {
        grid-template-columns: 1fr;
        gap: 15px;
        margin: 20px auto;
    }

    .card {
        padding: 20px;
    }

    .card p {
        font-size: 26px;
    }
}
    </style>
</head>
<body>

    <h1>Student Management Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Total Students</h2>
            <p>{{ total_students }}</p>
        </div>

        <div class="card">
            <h2>Python Students</h2>
            <p>{{ python_students }}</p>
        </div>

        <div class="card">
            <h2>Java Students</h2>
            <p>{{ java_students }}</p>
        </div>

        <div class="card">
            <h2>Other Courses</h2>
            <p>{{ other_students }}</p>
        </div>

    </div>
    <h2 style="text-align:center;">Course-wise Student Statistics</h2>

    <div style="width: 400px; max-width: 100%; margin: 30px auto;">
    <canvas id="courseChart"></canvas>
    </div>

    <a href="{% url 'student_list' %}">Back to Student List</a>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const ctx = document.getElementById('courseChart');

    new Chart(ctx, {
        type: 'doughnut',

        data: {
            labels: ['Python', 'Java', 'Other Courses'],

            datasets: [{
                label: 'Number of Students',

                data: [
                    {{ python_students }},
                    {{ java_students }},
                    {{ other_students }}
                ],

                backgroundColor: [
                    '#2563eb',
                    '#16a34a',
                    '#f59e0b'
                ],

                borderWidth: 1
            }]
        },

        options: {
            responsive: true
        }
    });
</script>    
    

</body>
</html>
